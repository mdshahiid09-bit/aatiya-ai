name: Build AATIYA AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle wrapper jar..."
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Report Build Failure to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logExcerpt = 'No build.log found';
            if (fs.existsSync('build.log')) {
              const content = fs.readFileSync('build.log', 'utf8');
              const lines = content.split('\n');
              const errors = lines.filter(l => l.includes('e:') || l.includes('FAILURE:') || l.includes('Compilation error') || l.includes('Unresolved reference'));
              if (errors.length > 0) {
                logExcerpt = errors.slice(0, 80).join('\n');
              } else {
                logExcerpt = lines.slice(-120).join('\n');
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build Failure Run #${context.runNumber}`,
              body: `### Build Failure Log (Run #${context.runNumber})\n\`\`\`\n${logExcerpt.slice(0, 60000)}\n\`\`\``
            });

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AATIYA-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AATIYA AI v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
          body: |
            ## 🌟 AATIYA AI Release v1.0.${{ github.run_number }}

            Production Android build for **AATIYA AI** - Real-time Gemini Live Voice & Multimodal Assistant.

            ### 🚀 Highlights
            - **Real-Time Gemini Live Audio:** Bi-directional native PCM streaming over WebSockets.
            - **Low-Latency Hardware Pipeline:** Android `AudioRecord` (16kHz) and `AudioTrack` (24kHz).
            - **Zero Fake Mocking:** Full real API integration with Google Gemini 2.0 / 2.5 Flash.
            - **Instant Barge-In:** Immediate speech interruption with hardware audio buffer flush.
            - **Keystore Security:** API keys encrypted using Android Keystore AES-256-GCM.
            - **Multi-language Fluency:** Fluent comprehension and voice responses in Hindi, Hinglish, and English.
            - **Custom Voice Personas:** Aoede (Default), Charon, Fenrir, Kore, and Puck.

            ### 📲 Installation & Testing:
            1. Download the `.apk` file below.
            2. Install the APK on your Android device (Android 8.0+ / SDK 26+).
            3. Launch **AATIYA AI** and input your Gemini API Key.
            4. Tap **Test Text Connection** and **Test Live Connection**.
            5. Start real-time voice conversations with the glowing interactive orb!
